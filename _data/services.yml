evolution:
  - title: "Sviluppo e autonomie"
    description: "Percorsi costruiti per sostenere partecipazione, autonomie, regolazione e competenze utili nella vita quotidiana."
  - title: "Comunicazione e linguaggio"
    description: "Interventi per aiutare ogni persona a comunicare in modo sempre più efficace, attraverso linguaggio, CAA e strumenti adatti alle proprie possibilità espressive."
  - title: "Autismo e neurodivergenze"
    description: "Interventi psicoeducativi costruiti sui punti di forza, sui bisogni e sugli obiettivi della persona, in dialogo con la famiglia e con la sua rete."
  - title: "Apprendimento e scuola"
    description: "Supporto personalizzato per affrontare le richieste scolastiche, sviluppare strategie efficaci e valorizzare il proprio modo di apprendere."
  - title: "Tutoraggio DSA e BES"
    description: "Percorsi individuali per costruire un metodo di studio più autonomo, utilizzare strumenti compensativi in modo efficace e rafforzare consapevolezza e fiducia nelle proprie competenze."
  - title: "Psicomotricità"
    description: "Esperienze attraverso corpo, movimento, gioco e relazione per accompagnare sviluppo, espressione, regolazione e consapevolezza di sé."
  - title: "Emozioni e relazioni"
    description: "Uno spazio per riconoscere ciò che si prova, comprendere le proprie esperienze e costruire nuove risorse nelle relazioni con gli altri."
  - title: "Genitorialità"
    description: "Consulenze e percorsi per accompagnare madri, padri e figure di riferimento nelle diverse fasi della crescita e nei momenti di maggiore difficoltà."
  - title: "Collaborazione con la scuola"
    description: "Confronto con insegnanti e servizi per condividere bisogni, obiettivi e strategie e favorire continuità tra i diversi contesti di vita."

adult:
  - title: "Benessere psicologico e relazionale"
    description: "Percorsi di sostegno per difficoltà emotive e relazionali, cambiamenti di vita e cura del proprio equilibrio."
  - title: "Salute femminile"
    description: "Accompagnamento in gravidanza e post partum, sostegno all’allattamento e cura del pavimento pelvico."
  - title: "Comunicazione e deglutizione nell’adulto"
    description: "Percorsi per sostenere la comunicazione e affrontare le difficoltà legate alla deglutizione, rispettando bisogni e obiettivi della persona."
  - title: "Nutrizione"
    description: "Educazione alimentare e percorsi personalizzati per costruire un rapporto sostenibile con l’alimentazione nelle diverse fasi della vita."
  - title: "Fisioterapia e riabilitazione"
    description: "Interventi di prevenzione e recupero funzionale per ritrovare movimento, autonomia e benessere."
  - title: "Osteopatia"
    description: "Un percorso rivolto all’equilibrio corporeo e al benessere, costruito nel rispetto delle esigenze della persona."
  - title: "Yoga e consapevolezza corporea"
    description: "Pratiche di movimento e respiro per coltivare ascolto, presenza ed equilibrio psicofisico."

