- name: Valeria Villani
  pic: 2
  position: <i>Ostetrica <br> Co-founder Spazio Indaco </i> 
  description: "<br> <br> L'ostetrica è una figura sanitaria essenziale che accompagna le donne in tutte le fasi della loro vita: dall'adolescenza all'età fertile, attraverso la gravidanza il parto e il puerperio, fino alla menopausa. Dopo la mia laurea presso l'Università degli Studi di Roma Tor Vergata nel 2013, ho iniziato la mia carriera lavorativa in un consultorio familiare a Roma. Nel 2015 mi sono trasferita in Emilia Romagna, dove ho dato alla luce i miei due bambini. Successivamente, nel 2019, ho lavorato come ostetrica di reparto e sala parto presso l'Arcispedale Santa Maria Nuova di Reggio Emilia. Nel 2021, ho deciso di intraprendere la strada della libera professione con un obiettivo chiaro: specializzarmi nella <b>salute del pavimento pelvico femminile</b>. Questa scelta è nata dalla mia profonda volontà di aiutare le donne a trovare una figura specializzata che le supporti nei loro percorsi di riabilitazione e benessere pelvico. Ho quindi avviato uno studio dedicato alla rieducazione e riabilitazione pelviperineale, dove posso individuare e trattare le varie problematiche legate al pavimento pelvico, collaborando, quando necessario, con altri professionisti del settore. Oltre la riabilitazione pelvica, offre percorsi di <b>accompagnamento alla nascita</b> per donne e coppia in attesa, <b>assistenza domiciliare durante il puerperio</b>, <b>sostegno all'allattamento al seno</b>, incontri tematici periodici. La mia missione è fornire un'assistenza personalizzata e continua, rispondendo a ogni esigenza delle donne migliorando la loro qualità di vita attraverso una cura attenta e specializzata."
  social:
    - title: instagram
      url: https://www.instagram.com/ostetrica_valeriavillani/
    - title: linkedin
      url: https://www.linkedin.com/in/valeria-villani-8957118a/

- name: Federica Coppola
  pic: 4
  position: <i>Biologa Nutrizionista</i>
  description: <br> Sono Federica, Biologa <b>Nutrizionista</b>, laureata in Biologia della Salute all'università di Bologna.
    <br>Per me, la <b>nutrizione</b> non è solo una questione di calorie, ma di <b>equilibrio</b>, <b>ascolto</b> e <b>benessere</b> a 360°.
    <br>Come Nutrizionista mi occupo di:<br><b>• Educazione alimentare</b>
    <br>• Piani alimentari per la <b>perdita di peso</b>
    <br>• Piani personalizzati per donne in <b>gravidanza</b>, <b>allattamento</b>, <b>menopausa</b>
    <br>• <b>Nutrizione sportiva</b>, aumento di massa muscolare
    <br>• <b>Mindful eating</b>
    <br><br><b>Cosa posso fare?</b>
    <br>Ti aiuto a trovare un'alimentazione che si adatti alla tua vita, senza rinunce!
    <br>Ti accompagno in un percorso sostenibile, senza stress e senza sensi di colpa.
    <br><br>Credo nella semplicità e nella naturalezza:niente soluzioni rigide, solo scelte consapevoli.
    <br>La tua alimentazione può diventare un'alleata per sentirti meglio e avere più energia ogni giorno.
  social:
    - title: instagram
      url: https://www.instagram.com/nutrizionistafedericacoppola/

- name: Elisa Zacheo
  pic: 3
  position: <i>Logopedista - Età evolutiva</i>
  description: <br> In dicembre 2021 mi sono laureata con lode in Logopedia presso l'Università di Modena e Reggio Emilia. Presso la stessa università, attualmente frequento il Corso di Perfezionamento <b>"La comunicazione aumentativa alternativa in età evolutiva"</b>. <br> Ho effettuato il corso <b>PROMPT</b> per il trattamento della disprassia verbale, il corso <b>Oral Motor Therapy</b> per la gestione e trattamento dello squilibrio muscolare orofacciale, e continuo a specializzarmi in particolare nell'ambito dell'<b>autismo</b> e della <b>balbuzie</b>. <br> Dal 2022 mi occupo di terapia logopedica in età evolutiva, in particolare in bambini con autismo, sindromi e gravi disabilità, all'interno di una struttura privata convenzionata al SSN. <br> Dal 2023 ho ampliato i miei interventi in libera professione a bambini e ragazzi con balbuzie e <b>disturbi specifici di linguaggio</b> e degli <b>apprendimenti</b>. Fondamentale nel mio intervento è il lavoro in sinergia con il bambino, la famiglia e la rete scolastica e di professionisti attorno al bambino, per favorire il benessere del paziente stesso e della sua famiglia.
  social:
    - title: instagram
      url: https://www.instagram.com/logopedista_elisa/
    - title: linkedin
      url: https://www.linkedin.com/in/elisa-zacheo-44786b228/

- name: Maddalena Barani  
  pic: 9
  position: <i>Logopedista - Età evolutiva</i>
  description: Mi sono laureata in <b>Logopedia</b> presso l'università di Modena e Reggio Emilia a novembre 2022, specializzandomi nella <b>valutazione</b> e nel <b>trattamento</b> del <b>linguaggio</b> e dell'<b>apprendimento</b>.
    <br>Ho arricchito la mia formazione con corsi specifici, ottenendo le qualifiche di:<br><b<Tecnico ABA</b>, con competenze su analisi del comportamento, insegnamento strutturato e gestione dei comportamenti problema nell'autismo.
    <br><b>Tutor DSA, BES e ADHD</b>, per supportare bambini e ragazzi con difficoltà scolastiche attraverso strategie personalizzate.
    <br><br>Attualmente lavoro come logopedista in libera professione occupandomi in particolare modo di:<b>disturbi del linguaggio</b>, DSA e <b>difficoltà di apprendimento</b>, <b>autismo</b> e <b>ritardo cognitivo</b>.
    <br>Oltre alla libera professione collaboro anche con la <b>Neuropsichiatrica Infantile</b> di Modena.
    <br>Nella terapia reputo fondamentale la creazione di una <b>relazione</b> con il <b>paziente</b> e la <b>collaborazione</b> tra le varie parti che compongono il suo ambiente:<b>genitori</b>, <b>rete scolastica</b> e/o altri <b>professionisti</b> che lo seguono.
