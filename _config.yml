  description: <br>Mi sono laureata in <b>Logopedia</b> nel 2023 presso l'Università di Modena e Reggio Emilia, con una tesi dedicata all'analisi delle abilità conversazionali nei <b>disturbi del neurosviluppo</b>.
    <br>Negli anni ho approfondito in particolare i <b>disturbi del linguaggio</b>, i <b>disordini motori dello speech</b>, i <b>disturbi dell'apprendimento</b>, l'<b>autismo</b>, l'<b>ADHD</b>, le <b>disabilità intellettive</b> e i <b>disturbi della comunicazione socio-pragmatica</b>.
    <br>Ho seguito percorsi specifici sulle <b>funzioni orali</b> e sugli <b>squilibri muscolari oro-facciali</b>, ambiti nei quali continuo a formarmi e che rappresentano parte integrante della mia pratica clinica.
    <br><br>Dal 2025 propongo anche <b>percorsi di formazione per genitori e neo-genitori</b> dedicati allo sviluppo del linguaggio e ad aspetti correlati. Parallelamente porto avanti attività di <b>advocacy</b> sull'<b>ADHD</b> e, più in generale, sui profili di sviluppo <b>neuroatipico</b>, con attenzione anche agli aspetti legati alla <b>medicina di genere</b>. La mia stessa diagnosi di ADHD in età adulta ha ampliato la mia visione personale e professionale, spingendomi a specializzarmi sempre di più nell'ambito delle difficoltà attentive lungo il continuum dall'età evolutiva a quella adulta.
    <br><br>Attualmente sono anche <b>studentessa di Sociologia</b> presso l'Università Alma Mater Studiorum di Bologna, perché credo che l'integrazione tra prospettiva clinica e sociale sia fondamentale per accompagnare ogni persona nel proprio percorso di crescita e benessere.
