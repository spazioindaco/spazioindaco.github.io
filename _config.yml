  description: <br>Trasmetto lo <b>yoga</b> come disciplina olistica che unisce <b>corpo, mente e anima</b>, basandomi sulla mia esperienza personale e professionale.
    <br>La mia formazione deriva dalla scuola <b>VINIYOGA</b>, che si fonda sugli insegnamenti del maestro <b>Tirumalai Krishnamacharya</b>. In questo approccio, lo yoga si modella sul singolo individuo come un <i>“abito su misura”</i>, adattandosi alle sue caratteristiche fisiche, mentali ed emotive.
    <br>Credo che, con una pratica costante, la profonda connessione tra <b>respiro e movimento</b> possa offrire uno strumento per rallentare, ritrovare equilibrio e coltivare una relazione più autentica con sé stessi e con il mondo che ci circonda.

- name: Agata Garofolin
  pic: Agata
  position: <i>Educatrice e Pedagogista</i>
  roles:
    - Educatrice
    - Pedagogista
  areas:
    - Sostegno alla genitorialità
    - Consulenza pedagogica
    - Benessere familiare
  description: |
    <p>Educatrice e Pedagogista, ha conseguito la laurea triennale in Scienze dell’Educazione e la laurea magistrale in Pedagogia presso l’Università degli Studi di Padova. Ha inoltre approfondito la propria formazione attraverso un Master in gestione e risoluzione dei conflitti, sviluppando competenze nell’ascolto dei bisogni e nell’accompagnamento delle dinamiche relazionali e familiari.</p>
    <p>Da diversi anni lavora con bambini e bambine da 0 a 12 anni e con le loro famiglie, occupandosi in particolare di benessere familiare, sostegno alla genitorialità e accompagnamento nei diversi momenti di crescita e trasformazione.</p>
    <p>Il suo intervento parte da una visione sistemica della famiglia, considerando i bisogni del bambino insieme alle relazioni e al contesto in cui è inserito. L’obiettivo è accompagnare genitori e figure di riferimento nella comprensione delle difficoltà, nella lettura dei bisogni e nell’individuazione di strategie educative sostenibili per la quotidianità.</p>
    <p>A Spazio Indaco propone consulenze e percorsi pedagogici rivolti ai genitori e alle famiglie, dal periodo perinatale fino all’età scolare, offrendo uno spazio di confronto su aspetti educativi, relazionali e sulle difficoltà che possono emergere nelle diverse fasi dello sviluppo.</p>
    <p>Il lavoro può integrarsi, quando necessario, con quello degli altri professionisti del centro, nell’ottica di costruire un accompagnamento multidisciplinare e coordinato intorno al bambino e alla sua famiglia.</p>

- name: Federica Beatrice
  pic: FedericaB
  photo_position: center top
  position: <i>Educatrice Professionale e Coach Professionista</i>
  roles:
    - Educatrice Professionale
    - Coach Professionista
  areas:
    - Tutoraggio DSA e BES
    - Autonomie
    - Coaching e inclusione lavorativa
  description: |
    <p>Educatrice Professionale, laureata in Scienze dell’Educazione (L-19), e Coach Professionista con formazione riconosciuta da ICF e AICP. La sua formazione integra competenze pedagogiche e comportamentali con metodologie orientate alla definizione di obiettivi e alla costruzione di strategie concrete per favorire autonomia, consapevolezza e partecipazione della persona nei diversi contesti di vita.</p>
    <p>Si occupa di bambini, ragazzi, giovani adulti e adulti, attraverso percorsi individualizzati costruiti a partire dalle caratteristiche, dalle risorse e dagli obiettivi della persona.</p>
    <p>In ambito scolastico propone percorsi di tutoraggio rivolti a studenti con DSA e altri Bisogni Educativi Speciali, dalla scuola primaria all’università, lavorando sul metodo di studio, sull’organizzazione, sulla motivazione e sull’utilizzo consapevole degli strumenti compensativi. L’obiettivo è favorire una progressiva autonomia nell’apprendimento e aiutare ogni studente a individuare strategie adatte al proprio modo di apprendere.</p>
    <p>Si occupa inoltre dello sviluppo delle autonomie personali e sociali, attraverso interventi finalizzati a sostenere l’indipendenza nella vita quotidiana, la partecipazione sociale e l’acquisizione di competenze utili nei diversi contesti di vita.</p>
    <p>Con ragazzi e adulti propone anche percorsi di coaching per l’inclusione e career coaching, orientati alla conoscenza delle proprie risorse, al bilancio delle competenze e all’accompagnamento nei momenti di ingresso, cambiamento o orientamento nel mondo del lavoro.</p>
    <p>La sua attività comprende infine la progettazione di interventi educativi in collaborazione con famiglie, istituti scolastici e realtà del territorio, con l’obiettivo di costruire percorsi condivisi e favorire continuità tra i diversi contesti della persona.</p>
    <p>A Spazio Indaco il suo lavoro può integrarsi con quello degli altri professionisti del centro, all’interno di percorsi multidisciplinari costruiti sulla persona e sui suoi obiettivi.</p>

